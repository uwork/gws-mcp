[project]
name = "gws-mcp"
version = "0.1.0"
description = "Google Workspace MCP Server for Claude.ai custom connector"
requires-python = ">=3.12"
dependencies = [
    "mcp[cli]>=1.6.0",
    "google-cloud-firestore>=2.19.0",
    "google-cloud-secret-manager>=2.22.0",
    "httpx>=0.27.0",
    "itsdangerous>=2.2.0",
    "pyjwt>=2.13.0",
    "cryptography>=48.0.1",
    "starlette>=1.3.1",
    "python-multipart>=0.0.31",
    "pydantic-settings>=2.14.2",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.9.0",
    "pytest>=8.0",
    "pytest-mock>=3.12",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I"]
