[project]
name = "gws-mcp"
version = "0.1.0"
description = "Google Sheets MCP Server for Claude.ai custom connector"
requires-python = ">=3.12"
dependencies = [
    "mcp[cli]>=1.6.0",
    "google-cloud-firestore>=2.19.0",
    "google-cloud-secret-manager>=2.22.0",
    "httpx>=0.27.0",
    "itsdangerous>=2.2.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.9.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I"]
